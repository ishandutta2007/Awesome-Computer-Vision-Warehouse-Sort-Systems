<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .scan-line {
        animation: scanAnim 4s ease-in-out infinite alternate;
      }
      .laser-beam {
        animation: beamPulse 4s ease-in-out infinite alternate;
      }
      .pulse-pill {
        animation: pulsePill 3s ease-in-out infinite alternate;
      }
      .packet-flow {
        stroke-dasharray: 8, 12;
        animation: flowDash 12s linear infinite;
      }
      .float-box {
        animation: floatAnim 5s ease-in-out infinite alternate;
      }

      @keyframes scanAnim {
        0% { transform: translateY(0px); opacity: 0.3; }
        50% { opacity: 0.85; }
        100% { transform: translateY(140px); opacity: 0.3; }
      }

      @keyframes beamPulse {
        0% { opacity: 0.2; transform: scaleY(0.7); }
        50% { opacity: 0.6; transform: scaleY(1.0); }
        100% { opacity: 0.2; transform: scaleY(0.7); }
      }

      @keyframes flowDash {
        to { stroke-dashoffset: -200; }
      }

      @keyframes floatAnim {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }

      @keyframes pulsePill {
        0% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.4)); }
        100% { filter: drop-shadow(0 0 10px rgba(129, 140, 248, 0.8)); }
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Conveyor / Grid Perspective Lines in Background -->
  <g opacity="0.18">
    <line x1="0" y1="360" x2="480" y2="240" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="1200" y1="360" x2="720" y2="240" stroke="#818cf8" stroke-width="1.5" />
    <line x1="200" y1="360" x2="540" y2="240" stroke="#38bdf8" stroke-width="1" />
    <line x1="1000" y1="360" x2="660" y2="240" stroke="#818cf8" stroke-width="1" />
    <line x1="400" y1="360" x2="580" y2="240" stroke="#38bdf8" stroke-width="1" />
    <line x1="800" y1="360" x2="620" y2="240" stroke="#818cf8" stroke-width="1" />
    <line x1="600" y1="360" x2="600" y2="240" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Horizontal Crossbars -->
    <line x1="380" y1="260" x2="820" y2="260" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="280" y1="290" x2="920" y2="290" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6,6" />
    <line x1="150" y1="325" x2="1050" y2="325" stroke="#818cf8" stroke-width="1" stroke-dasharray="8,8" />
  </g>

  <!-- Flowing Data Circuit Paths (Background dynamic element) -->
  <g class="packet-flow" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35">
    <path d="M 40 80 Q 200 40 380 90 T 700 60 T 1160 80" />
    <path d="M 40 280 Q 300 330 600 290 T 1160 300" stroke="#c084fc" />
  </g>

  <!-- Dynamic Background Scanning Beam & Bounding Boxes (Warehouse Computer Vision Theme) -->
  <g transform="translate(930, 60)" class="float-box" opacity="0.75">
    <!-- 3D Bounding Target Box -->
    <rect x="0" y="30" width="160" height="110" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" />
    <!-- 6-DoF Axis indicator -->
    <line x1="80" y1="85" x2="120" y2="85" stroke="#ef4444" stroke-width="2" />
    <line x1="80" y1="85" x2="80" y2="45" stroke="#22c55e" stroke-width="2" />
    <line x1="80" y1="85" x2="55" y2="105" stroke="#3b82f6" stroke-width="2" />
    <circle cx="80" cy="85" r="3" fill="#ffffff" />
    <text x="125" y="89" fill="#ef4444" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10">X</text>
    <text x="76" y="40" fill="#22c55e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10">Y</text>
    <text x="45" y="115" fill="#3b82f6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10">Z</text>
    <!-- LiDAR Scan Plane -->
    <g class="scan-line">
      <line x1="-10" y1="20" x2="170" y2="20" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
      <polygon points="0,20 160,20 120,45 40,45" fill="url(#beamGrad)" />
    </g>
    <!-- Label -->
    <text x="5" y="20" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">6-DoF GRASP: 99.4%</text>
  </g>

  <!-- Left Camera Reticle (Computer Vision Focus) -->
  <g transform="translate(100, 100)" opacity="0.4" class="float-box">
    <circle cx="40" cy="40" r="35" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="10, 6" />
    <line x1="5" y1="40" x2="75" y2="40" stroke="#818cf8" stroke-width="1" />
    <line x1="40" y1="5" x2="40" y2="75" stroke="#818cf8" stroke-width="1" />
    <circle cx="40" cy="40" r="4" fill="#38bdf8" />
  </g>

  <!-- FOREGROUND CONTENT: Header Title, Subtitle, Badges (Unobstructed & Ultra Legible) -->
  <g transform="translate(80, 75)">
    <!-- Top Meta Tag / Pill -->
    <g class="pulse-pill">
      <rect x="0" y="0" width="310" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="14" cy="14" r="5" fill="#10b981" />
      <text x="28" y="18" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="600" letter-spacing="1">
        INDUSTRIAL ROBOTICS &amp; PHYSICAL AI
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" fill="url(#glowGrad)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      Warehouse Sort Systems
    </text>

    <!-- Subtitle -->
    <text x="0" y="118" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="600">
      Awesome Computer Vision, 6-DoF Grasp Detection &amp; Bin Picking
    </text>

    <!-- Descriptor text -->
    <text x="0" y="148" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="400">
      Curated industrial SaaS platforms, deep-learning perception algorithms &amp; open-source robotics stacks
    </text>

    <!-- Category Pills / Badges in Foreground -->
    <g transform="translate(0, 175)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="600">📦 Bin Picking</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="155" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="157" y="17" fill="#818cf8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="600">🎯 6-DoF Pose Est.</text>

      <!-- Pill 3 -->
      <rect x="310" y="0" width="165" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="322" y="17" fill="#c084fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="600">🤖 Parcel Induction</text>

      <!-- Pill 4 -->
      <rect x="485" y="0" width="155" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="497" y="17" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="600">⚡ RaaS &amp; Vision AI</text>
    </g>
  </g>
</svg>
